
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Подробная информация о товаре — NEXUS PC">
    <title>Товар — NEXUS PC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">NEXUS<span>PC</span></a>

            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="index.html#catalog">Каталог</a>
                <a href="index.html#about">О нас</a>
                <a href="index.html#contacts">Контакты</a>
            </nav>

            <a href="index.html#catalog" class="btn btn-outline">
                В каталог
            </a>
        </div>
    </header>

    <main class="product-page">
        <div class="container">

            <a href="index.html#catalog" class="product-back">
                ← Вернуться в каталог
            </a>

            <div class="product-detail">

                <div class="product-detail-image">
                    <img id="productImage" src="" alt="Изображение товара">
                </div>

                <div class="product-detail-info">
                    <span id="productCategory" class="product-detail-category"></span>

                    <h1 id="productName">Загрузка товара...</h1>

                    <p id="productDescription" class="product-detail-description"></p>

                    <div class="product-detail-price" id="productPrice"></div>

                    <button id="addProductToCart" class="btn btn-primary">
                        Добавить в корзину
                    </button>

                    <p class="product-detail-note">
                        Демонстрационный магазин NEXUS PC
                    </p>
                </div>

            </div>

            <section class="product-specifications">
                <h2>Характеристики</h2>

                <div id="productSpecs" class="product-specs-list"></div>
            </section>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 NEXUS PC. Все права защищены.</p>
        </div>
    </footer>

    <script src="products-data.js"></script>
    <script src="product.js"></script>

</body>
</html>
