
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа — NEXUS PC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">NEXUS<span>PC</span></a>
        <a href="index.html" class="back-link">← Вернуться в магазин</a>
    </header>

    <main class="checkout-page">
        <div class="checkout-heading">
            <p class="eyebrow">ПОСЛЕДНИЙ ШАГ</p>
            <h1>Оформление заказа</h1>
            <p>Заполните данные, чтобы завершить оформление.</p>
        </div>

        <div class="checkout-layout">

            <section class="checkout-form-section">
                <h2>Контактные данные</h2>

                <form id="checkoutForm">

                    <label for="customerName">Ваше имя</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="Например, Алексей"
                        required
                    >

                    <label for="customerPhone">Номер телефона</label>
                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="+7 900 000-00-00"
                        required
                    >

                    <label for="customerEmail">Электронная почта</label>
                    <input
                        type="email"
                        id="customerEmail"
                        placeholder="example@mail.ru"
                        required
                    >

                    <label for="customerAddress">Адрес доставки</label>
                    <textarea
                        id="customerAddress"
                        placeholder="Город, улица, дом, квартира"
                        required
                    ></textarea>

                    <button type="submit" class="main-button checkout-submit">
                        Подтвердить заказ
                    </button>

                </form>
            </section>

            <section class="order-summary">
                <h2>Ваш заказ</h2>

                <div id="checkoutItems"></div>

                <div class="summary-total">
                    <span>Итого:</span>
                    <strong id="checkoutTotal">0 ₽</strong>
                </div>
            </section>

        </div>

        <div class="order-success" id="orderSuccess" hidden>
            <div class="success-icon">✓</div>
            <h2>Заказ оформлен!</h2>
            <p>Спасибо за выбор NEXUS PC.</p>
            <p id="orderNumber"></p>
            <a href="index.html" class="main-button">Вернуться в магазин</a>
        </div>

    </main>

    <script src="checkout.js"></script>
</body>
</html>
